[project]
name = "heattrain"
version = "0.1.0"
description = "Offline training and evaluation of the watch matchers"
authors = [
    { name = "AAPPHH", email = "147189916+AAPPHH@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.1",
    "pyarrow>=19.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.15.0",
    "skl2onnx>=1.20.0",
    "tzdata>=2025.2",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
