listen = "0.0.0.0:8080"
db_path = "/data/heatd.duckdb"
data_dir = "/data"
inventory_dir = "/data/inventory"
snapshot_path = "/data/snapshot.duckdb"
dataset_path = "/secrets/thread_dataset.hex"
model_path = "/models/room_model.onnx"
controller = "chip-tool"
thread_cli_prefix = "ot "
default_setpoint = 18.0
away_setpoint = 18.0
away_guard_minutes = 20
manual_hold_minutes = 60
poll_silence_s = 60
# exploration_seed = 1
latitude = 52.52
longitude = 13.40
# weather_url = "https://api.open-meteo.com/v1/forecast"
# ntp_server = "pool.ntp.org"
occupied_setpoint = 20.0
occupancy_enter_min = 10
occupancy_exit_min = 45
min_write_interval_min = 15
setpoint_deadband = 0.3
sleep_room = "schlafzimmer"
presence_timeout_minutes = 30
still_contact_timeout_minutes = 180
frost_setpoint = 8.0
neighbours = [
    { a = "wohnzimmer", b = "flur", kind = "wall" },
    { a = "wohnzimmer", b = "bad", kind = "wall" },
    { a = "kueche", b = "flur", kind = "wall" },
    { a = "kueche", b = "bad", kind = "wall" },
    { a = "bad", b = "flur", kind = "wall" },
    { a = "schlafzimmer", b = "wohnzimmer", kind = "ceiling" },
    { a = "schlafzimmer", b = "kueche", kind = "ceiling" },
    { a = "schlafzimmer", b = "bad", kind = "ceiling" },
    { a = "schlafzimmer", b = "flur", kind = "ceiling", partial = true },
    { a = "flur", b = "schlafzimmer", kind = "open" },
]

[br_watchdog]
enabled = true
url = "http://192.168.178.33"
token_file = "/secrets/br_watchdog_token"
interval_s = 30
timeout_s = 600

[heat_source]
kind = "oil"
scope = "central"
efficiency_class = "E"
flow_temp_controllable = false
night_setback_controllable = false

[building]
floor = 3
roof_rooms = ["schlafzimmer"]

[watchmatch]
enabled = true
model_dir = "/models/watchroom"
model_version = "latest"
scan_fresh_s = 180
labels_since = "2026-10-29T20:28:00+01:00"
label_target = 10
label_tolerance_s = 30
anchor_devices = ["minix-anchor"]

[boost]
enabled = true
auto_live = true
live_gate_days = 7
live_min_backtest_cycles = 3
live_rooms_override = []
explore_min = 10.0
model_dir = "/models/thermal"
reload_min = 5.0
boost_setpoint = 28.0

[watchmatch.state]
hr_rest_max = 70
hr_active_min = 90
motion_active_min = 0.5
sleep_hours = "23-7"

[chip_tool]
binary = "/usr/local/bin/chip-tool"
storage_dir = "/chip-storage"
paa_trust_store = "/opt/paa-root-certs"
bypass_attestation = false
endpoint = 1
subscribe_min_s = 30
subscribe_max_s = 300
timeout_s = 90
commission_timeout_s = 180

[[rooms]]
name = "wohnzimmer"
nodes = [5]
home_setpoint = 20.0

[[rooms]]
name = "schlafzimmer"
nodes = [6]
home_setpoint = 20.0

# [rooms.exploration]
# enabled = false
# p_per_day = 1.0
# comfort_min = 16.0
# comfort_max = 21.0
# blackout = [{ from = "22:00", to = "07:00" }]

[[rooms]]
name = "bad"
nodes = [7]
home_setpoint = 20.0

[[rooms]]
name = "kueche"
nodes = [8]

[[rooms]]
name = "flur"
exterior = ["front_door"]

[window]
enabled = true
model_dir = "/models/window"
reload_min = 10.0
hold_min = 20.0
rearm_min = 30.0
room_z = 1.0
setpoint_guard_min = 20.0
manual_max_min = 720.0
label_grace_min = 25.0
prompt_expire_min = 20.0
prompt_gap_min = 10.0
prompt_global_gap_min = 30.0
prompt_max_per_day = 6

[supply]
enabled = true
valve_pct = 90
min_min = 45
flat_k_per_h = 0.2
recover_k_per_h = 1.0
recover_window_min = 15
cap_k = 0.5
learn_days = 14
overshoot_k = 1.0
overshoot_valve_pct = 50
overshoot_min = 15
reset_min = 10
reset_gap_min = 120

[failsafe]
setpoint = 18.0
max_c = 22.0
boost_max_c = 28.5
shutdown_timeout_s = 30

[node_health]
enabled = true
tick_s = 30.0
silent_min = 10.0
unreachable_min = 30.0
min_gap_s = 60.0
backoff_start_s = 120.0
backoff_max_min = 10.0
unreachable_backoff_max_min = 240.0
reset_gap_min = 30.0
max_restarts = 1
restart_grace_s = 180.0
verify_min = 10.0
tolerance_c = 0.3
alert_retries = 3
