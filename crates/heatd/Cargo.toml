[package]
name = "heatd"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
matter-controller = { path = "../matter-controller" }
anyhow = "1"
libm = "0.2"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
duckdb = { version = "1", features = ["bundled", "parquet", "json"] }
ort = "=2.0.0-rc.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "0.8"
ureq = "3"
arrow = { version = "60", default-features = false, features = ["ipc"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
