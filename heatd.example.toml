listen = "0.0.0.0:8080"
db_path = "data/heatd.duckdb"
data_dir = "data"
inventory_dir = "inventory"
snapshot_path = "data/snapshot.duckdb"
dataset_path = "secrets/thread_dataset.hex"
model_path = "models/room_model.onnx"
controller = "chip-tool"
thread_cli_prefix = "ot "
default_setpoint = 18.0
away_setpoint = 18.0
away_guard_minutes = 20
manual_hold_minutes = 60
poll_silence_s = 60
# exploration_seed = 1
occupied_setpoint = 21.0
sleep_room = "schlafzimmer"
presence_timeout_minutes = 30
still_contact_timeout_minutes = 180
frost_setpoint = 7.0
# weather and coordinates meta stay disabled until both are set
latitude = 52.52
longitude = 13.40
ntp_server = "pool.ntp.org"
neighbours = [
    { a = "wohnzimmer", b = "flur", kind = "wall" },
    { a = "wohnzimmer", b = "bad", kind = "wall" },
    { a = "kueche", b = "flur", kind = "wall" },
    { a = "kueche", b = "bad", kind = "wall" },
    { a = "bad", b = "flur", kind = "wall" },
    { a = "schlafzimmer", b = "wohnzimmer", kind = "ceiling" },
    { a = "schlafzimmer", b = "kueche", kind = "ceiling" },
    { a = "schlafzimmer", b = "bad", kind = "ceiling" },
    { a = "schlafzimmer", b = "flur", kind = "ceiling", partial = true },
    { a = "flur", b = "schlafzimmer", kind = "open" },
]

[heat_source]
kind = "oil"
scope = "central"
efficiency_class = "E"
flow_temp_controllable = false
night_setback_controllable = false

[building]
floor = 3
roof_rooms = ["schlafzimmer"]

[watchmatch]
enabled = true
model_dir = "/models/watchroom"
model_version = "latest"
scan_fresh_s = 180

[watchmatch.state]
hr_rest_max = 70
hr_active_min = 90
motion_active_min = 0.5
sleep_hours = "23-7"

[chip_tool]
binary = "chip-tool"
# storage_dir = "/home/user/snap/chip-tool/common"
paa_trust_store = "/home/user/snap/chip-tool/common/paa-root-certs"
bypass_attestation = false
endpoint = 1
subscribe_min_s = 30
subscribe_max_s = 300
timeout_s = 90
commission_timeout_s = 180

[[rooms]]
name = "wohnzimmer"
nodes = [5]

[[rooms.schedules]]
days = ["weekdays"]
from = "06:00"
to = "08:30"
setpoint = 21.0

[[rooms.schedules]]
days = ["weekdays"]
from = "17:00"
to = "22:30"
setpoint = 21.5

[[rooms.schedules]]
days = ["weekend"]
from = "08:00"
to = "23:00"
setpoint = 21.5

[[rooms]]
name = "schlafzimmer"
nodes = [6]

[rooms.exploration]
enabled = false
p_per_day = 1.0
comfort_min = 16.0
comfort_max = 21.0
blackout = [{ from = "22:00", to = "07:00" }]

[[rooms.schedules]]
days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
from = "21:00"
to = "07:00"
setpoint = 18.5

[[rooms]]
name = "bad"
nodes = [7]

[[rooms.schedules]]
days = ["weekdays"]
from = "06:00"
to = "08:00"
setpoint = 22.0

[[rooms]]
name = "kueche"
nodes = [8]

[[rooms.schedules]]
days = ["weekdays"]
from = "06:30"
to = "08:00"
setpoint = 21.0

[[rooms.schedules]]
days = ["weekdays"]
from = "17:30"
to = "20:00"
setpoint = 21.0

[[rooms]]
name = "flur"
exterior = ["front_door"]

[window]
enabled = true
model_dir = "/models/window"
reload_min = 10.0
hold_min = 20.0
rearm_min = 30.0
room_z = 1.0
setpoint_guard_min = 20.0
manual_max_min = 720.0
label_grace_min = 25.0
prompt_expire_min = 20.0
prompt_gap_min = 10.0
prompt_global_gap_min = 30.0
prompt_max_per_day = 6

[boost]
enabled = true
model_dir = "/models/boost"
reload_min = 5.0
morning_hours = [5.0, 11.0]
min_rise_k = 1.0
trigger_window_min = 3.0
measure_min = 60.0
after_window_min = 180.0
homecoming_min_away_min = 60.0

[failsafe]
setpoint = 18.0
max_c = 22.0
boost_max_c = 28.5
shutdown_timeout_s = 30

[node_health]
enabled = true
tick_s = 30.0
silent_min = 10.0
unreachable_min = 30.0
min_gap_s = 60.0
backoff_start_s = 120.0
backoff_max_min = 10.0
unreachable_backoff_max_min = 240.0
reset_gap_min = 30.0
max_restarts = 1
restart_grace_s = 180.0
verify_min = 10.0
